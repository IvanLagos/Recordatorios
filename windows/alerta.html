<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recordatorio</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#2563eb;color:#fff;font:16px/1.4 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:28px 32px;border:3px solid #fff;-webkit-app-region:drag;user-select:none}
  .tag{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
  h1{font-size:2.4rem;margin:8px 0 6px;word-break:break-word;line-height:1.15}
  .note{font-size:1.2rem;opacity:.95;word-break:break-word}
  .hora{margin-top:10px;opacity:.85}
  .mas{font-size:.9rem;opacity:.9}
  .btns{display:flex;gap:10px;-webkit-app-region:no-drag}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}
  #hecho{background:#fff;color:#1d4ed8;flex:1.3}
  #pos{background:#1d4ed8;color:#fff;flex:1.3}
  #cer{background:transparent;color:#fff;border:2px solid #ffffff88;flex:.8}
  button:hover{filter:brightness(.93)}
</style>
</head>
<body>
  <div>
    <div class="tag">⏰ Recordatorio</div>
    <h1 id="t"></h1>
    <div class="note" id="n"></div>
    <div class="hora" id="h"></div>
  </div>
  <div>
    <div class="mas" id="mas"></div>
    <div class="btns">
      <button id="hecho">✓ Hecho</button>
      <button id="pos">Posponer 10 min</button>
      <button id="cer">Cerrar</button>
    </div>
  </div>
<script>
let lista=[],ctx=null,timer=null;
const $=id=>document.getElementById(id);

function pitar(){
  try{ctx=ctx||new AudioContext();
    [0,.25,.5].forEach(o=>{const s=ctx.createOscillator(),g=ctx.createGain();s.connect(g);g.connect(ctx.destination);
      s.frequency.value=880;g.gain.value=.2;s.start(ctx.currentTime+o);s.stop(ctx.currentTime+o+.15)})}catch(e){}
}
function pintar(){
  const a=lista[0];if(!a)return;
  $('t').textContent=a.title;
  $('n').textContent=a.note||'';
  $('h').textContent='Programado: '+new Date(a.due).toLocaleString('es-CL',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  $('mas').textContent=lista.length>1?'+ '+(lista.length-1)+' recordatorio(s) más esperando':'';
}
electronAPI.onLista(l=>{lista=l;pintar();pitar()});
electronAPI.alertaLista();
clearInterval(timer);timer=setInterval(pitar,6000); // repite el sonido hasta que lo atiendas

const act=tipo=>()=>{const a=lista[0];if(a)electronAPI.enviarAccion({id:a.id,tipo})};
$('hecho').onclick=act('hecho');
$('pos').onclick=act('posponer');
$('cer').onclick=act('cerrar');
</script>
</body>
</html>
